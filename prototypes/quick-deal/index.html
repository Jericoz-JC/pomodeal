<style>
/*
  Design plan
  Subject: a deal you make with yourself. The deal is a ticket; accepting it stamps it; the ledger is a stack of torn stubs.
  Color: one accent, an "approved" stamp green, on grey-green paper. Block type is shown by form, not hue:
         focus = solid green ring, break = hatched ink ring.
  Type: Archivo condensed (ticket printing) for numbers and headings; Atkinson Hyperlegible for everything you read.
  Layout: one phone column, left-aligned text, the dial centered as the single bold object. No caps labels, no dot separators.
*/
:root {
  --paper: #EDEFE9;
  --card: #FBFCF9;
  --ink: #1B211D;
  --soft: #566058;
  --rule: #C9D0C8;
  --edge: #6F7A72;
  --sheet: #FBFCF9;
  --scrim: rgba(15, 20, 17, .52);
  --deal: #1E6A46;
  --on-deal: #FFFFFF;
  --deal-soft: #DDEADF;
  --hatch: rgba(27, 33, 29, .62);
  --font-head: "Archivo", "Arial Narrow", "Segoe UI", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #17201B; --card: #1F2A24; --ink: #E6ECE7; --soft: #A3B0A7; --rule: #33413A; --edge: #74847A; --sheet: #26302B; --scrim: rgba(0, 0, 0, .6);
    --deal: #6CCB97; --on-deal: #0F1A14; --deal-soft: #23382C; --hatch: rgba(230, 236, 231, .55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #17201B; --card: #1F2A24; --ink: #E6ECE7; --soft: #A3B0A7; --rule: #33413A; --edge: #74847A; --sheet: #26302B; --scrim: rgba(0, 0, 0, .6);
  --deal: #6CCB97; --on-deal: #0F1A14; --deal-soft: #23382C; --hatch: rgba(230, 236, 231, .55); color-scheme: dark;
}
@property --p { syntax: "<number>"; inherits: true; initial-value: 1; }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }

:focus-visible { outline: 3px solid var(--deal); outline-offset: 2px; border-radius: 8px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* prototype strip: demo controls, not product */
.proto { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding-block: 8px; font-size: 13px; color: var(--soft); border-bottom: 1px dashed var(--rule); }
.proto strong { color: var(--ink); }
.chipbtn { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 13px; min-height: 32px; }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

main { flex: 1; display: flex; flex-direction: column; gap: 20px; padding-block: 24px 124px; }
h1, h2 { font-family: var(--font-head); margin: 0; text-wrap: balance; }
h1 { font-size: 34px; line-height: 1.02; font-weight: 800; font-stretch: 78%; letter-spacing: -0.005em; }
h2 { font-size: 24px; line-height: 1.1; font-weight: 750; font-stretch: 82%; }
h3 { font-size: 16px; margin: 0; font-weight: 700; }
p { margin: 0; }
.soft { color: var(--soft); }
.small { font-size: 14.5px; }
.example { font-size: 14px; color: var(--soft); font-style: italic; }

/* buttons */
.primary, .secondary { width: 100%; min-height: 54px; border-radius: 12px; padding: 14px 18px; font-weight: 700; font-size: 17px; line-height: 1.4; display: block; text-align: center; }
.primary small, .secondary small { display: block; }
.primary:disabled { opacity: .5; cursor: not-allowed; }
.primary { border: none; background: var(--deal); color: var(--on-deal); }
.primary small { font-weight: 400; font-size: 14px; opacity: .9; }
.secondary { border: 1.5px solid var(--edge); background: transparent; color: var(--ink); }
.textbtn { background: none; border: none; color: var(--soft); text-decoration: underline; text-underline-offset: 3px; padding: 10px 16px; min-height: 44px; align-self: center; font-size: 15px; }
.stack { display: flex; flex-direction: column; gap: 10px; }

/* activity chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--edge); background: var(--card); border-radius: 999px; padding: 10px 17px; min-height: 44px; font-weight: 700; font-size: 16px; }

/* the deal ticket */
.ticket.push { margin-top: auto; }

.ticket .stub::before, .ticket .stub::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); }
.ticket .stub::before { left: -10px; } .ticket .stub::after { right: -10px; }
.sentence { font-family: var(--font-head); font-size: 30px; line-height: 1.12; font-weight: 750; font-stretch: 80%; text-wrap: pretty; }
.tok { font: inherit; background: none; border: none; padding: 0 1px; border-radius: 4px; color: inherit; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; text-decoration-color: var(--edge); text-decoration-style: dashed; padding-block: 6px; margin-block: -6px; }
.tok:hover, .tok[aria-expanded="true"] { text-decoration-style: solid; text-decoration-color: var(--deal); }
.picker { display: flex; flex-wrap: wrap; gap: 8px; }
.picker .chip { font-size: 15px; padding: 10px 16px; }
.picker input { flex: 1 1 180px; min-width: 0; min-height: 44px; border: 1.5px solid var(--edge); border-radius: 10px; padding: 10px 12px; background: var(--paper); }
.hint { font-size: 14px; color: var(--soft); text-align: center; }
.stamp { position: absolute; right: 18px; top: 16px; font-family: var(--font-head); font-stretch: 70%; font-weight: 900; font-size: 30px; letter-spacing: .02em; color: var(--deal);
  border: 3px solid var(--deal); border-radius: 8px; padding: 0 10px; transform: rotate(-9deg); opacity: 0; pointer-events: none; }
.ticket.stamped .stamp { opacity: .92; animation: stamp .32s cubic-bezier(.2,1.6,.4,1); }
@keyframes stamp { from { transform: rotate(-9deg) scale(1.9); opacity: 0; } }

/* clock persona */
.clockline { display: flex; gap: 12px; align-items: flex-start; }
.clockface { flex: none; width: 34px; height: 34px; }
.clockface .hand { transform-origin: 20px 20px; }
.clockline.tick .hand.m { animation: tickm .45s ease-out; }
@keyframes tickm { from { transform: rotate(-50deg); } }
.bubble { padding-top: 4px; font-size: 17px; line-height: 1.45; }

/* the dial: minute ticks, a ring that drains, solid for focus, hatched for a break */
.timerwrap { display: grid; place-items: center; gap: 12px; }
.dial { position: relative; width: min(68vw, 260px); aspect-ratio: 1; max-width: 100%; }
.dial > * { position: absolute; border-radius: 50%; }
.dial .ticks { inset: 0; opacity: .6; background: repeating-conic-gradient(from -.5deg, var(--edge) 0 1deg, transparent 1deg calc(360deg / var(--n)));
  -webkit-mask: radial-gradient(circle closest-side, transparent 93%, #000 94%); mask: radial-gradient(circle closest-side, transparent 93%, #000 94%); }
.dial .ticks5 { inset: 0; background: conic-gradient(from -1deg, var(--ink) 0 2deg, transparent 2deg);
  -webkit-mask: radial-gradient(circle closest-side, transparent 88%, #000 89%); mask: radial-gradient(circle closest-side, transparent 88%, #000 89%); }
.dial .edge { inset: 11%; transform: rotate(calc(var(--p) * 1turn)); }
.dial .edge::before { content: ""; position: absolute; left: 50%; top: 8.5%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--paper); }
.dial.done .fill { opacity: .4; }
.dial.done .edge { display: none; }
.dial.heads .track { background: var(--deal-soft); }
.note.heads { color: var(--ink); font-weight: 700; }
.dial .track, .dial .fill { inset: 11%; -webkit-mask: radial-gradient(circle closest-side, transparent 66%, #000 67%); mask: radial-gradient(circle closest-side, transparent 66%, #000 67%); }
.dial .track { background: var(--rule); }
.dial .fill { -webkit-mask: conic-gradient(#000 calc(var(--p) * 1turn), transparent 0), radial-gradient(circle closest-side, transparent 66%, #000 67%);
  -webkit-mask-composite: source-in; mask: conic-gradient(#000 calc(var(--p) * 1turn), transparent 0) intersect, radial-gradient(circle closest-side, transparent 66%, #000 67%); }
.fill.focus { background: var(--deal); }
.fill.break { background: repeating-linear-gradient(135deg, var(--hatch) 0 3px, transparent 3px 8px), var(--card); }
.dial.sweep { animation: sweep .7s ease-out; }

.dial .face { inset: 24%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.face .big { font-family: var(--font-head); font-size: 76px; font-weight: 800; font-stretch: 70%; line-height: .9; font-variant-numeric: tabular-nums; }
.face .big.mmss { font-size: 58px; }
.face .big.word { font-size: 52px; }
.face .unit { font-size: 15px; color: var(--soft); }
.now { display: flex; flex-direction: column; gap: 4px; }
.kind { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; color: var(--soft); }
.swatch { width: 18px; height: 18px; border-radius: 50%; flex: none; }
.swatch.focus { background: var(--deal); }
.swatch.break { background: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 5px), var(--card); box-shadow: inset 0 0 0 1px var(--edge); }
.note { font-size: 15px; color: var(--soft); text-align: center; min-height: 22px; }
.note.go { color: var(--deal); font-weight: 700; }

.plan { display: flex; flex-direction: column; gap: 0; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.plan li { list-style: none; display: grid; grid-template-columns: 18px 1fr auto; gap: 12px; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--rule); font-size: 15.5px; }
.plan li span:nth-child(2) { min-width: 0; }

.num { font-family: var(--font-head); font-stretch: 80%; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 440px; background: var(--sheet); border-top: 1px solid var(--rule); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; gap: 14px;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  max-height: 92%; overflow-y: auto; }
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--rule); align-self: center; }
.sheet h2:focus { outline: none; }
.option { text-align: left; border: 1.5px solid var(--edge); background: transparent; border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; width: 100%; min-height: 64px; }
.option:hover, .option:active { border-color: var(--deal); box-shadow: inset 0 0 0 1px var(--deal); }
.option strong { font-size: 17px; }
.option span { grid-column: 1; color: var(--soft); font-size: 15px; }
.option svg { grid-column: 2; grid-row: 1 / span 2; width: 20px; height: 20px; color: var(--soft); }
.terms { display: flex; flex-direction: column; gap: 10px; }
.term { position: relative; text-align: left; width: 100%; background: var(--paper); border: 1.5px solid var(--edge); border-radius: 6px; padding: 0; display: flex; flex-direction: column; }
.term .top { padding: 12px 52px 10px 16px; font-family: var(--font-head); font-stretch: 78%; font-weight: 750; font-size: 24px; line-height: 1.1; }
.term .cost { position: relative; border-top: 2px dashed var(--rule); padding: 10px 16px 12px; color: var(--soft); font-size: 15px; }
.term .cost::before, .term .cost::after { content: ""; position: absolute; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--sheet); border: 1.5px solid var(--edge); }
.term .cost::before { left: -9px; clip-path: inset(0 0 0 50%); } .term .cost::after { right: -9px; clip-path: inset(0 50% 0 0); }
.term .radio { position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--edge); background: var(--card); display: grid; place-items: center; }
.term[aria-checked="true"] { border-color: var(--deal); border-width: 2.5px; }
.term[aria-checked="true"] .radio { border-color: var(--deal); background: var(--deal); }
.term[aria-checked="true"] .radio::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--on-deal); }
.term[aria-checked="true"] .cost { color: var(--ink); }
.term .stamp { top: auto; bottom: 10px; right: 14px; font-size: 22px; padding: 0 8px; }

.term.stamped .stamp { opacity: .92; animation: stamp .32s cubic-bezier(.2,1.6,.4,1); }
.picked { font-size: 15px; color: var(--soft); }
.picked b { color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-weight: 700; }
.field input { border: 1.5px solid var(--edge); border-radius: 10px; padding: 12px; min-height: 48px; background: var(--paper); }
.field input::placeholder { color: var(--soft); font-style: italic; }
.countdown { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.countdown i { display: block; height: 100%; background: var(--deal); width: 100%; }

/* ledger: torn stubs */
.tally { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.tally div { padding: 12px 10px 12px 0; display: flex; flex-direction: column; gap: 4px; }
.tally div + div { border-left: 1px solid var(--rule); padding-left: 12px; }
.tally b { font-family: var(--font-head); font-stretch: 72%; font-size: 34px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
.tally div > span { font-size: 14px; color: var(--soft); line-height: 1.25; white-space: nowrap; }
.stubs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.stubs li { background: var(--card); display: grid; grid-template-columns: 84px 1fr; position: relative; padding-right: 8px;
  -webkit-mask: linear-gradient(#000 0 0) left / calc(100% - 6px) 100% no-repeat, conic-gradient(from 225deg at right, #000 90deg, #0000 0) right top / 6px 12px repeat-y;
  mask: linear-gradient(#000 0 0) left / calc(100% - 6px) 100% no-repeat, conic-gradient(from 225deg at right, #000 90deg, #0000 0) right top / 6px 12px repeat-y; }
.stubs .t { position: relative; border-right: 2px dashed var(--rule); padding: 12px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.stubs .t b { font-family: var(--font-head); font-stretch: 80%; font-weight: 750; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.stubs .t small { font-size: 13px; color: var(--soft); letter-spacing: .04em; }
.stubs .t::before, .stubs .t::after { content: ""; position: absolute; right: -7px; width: 12px; height: 12px; border-radius: 50%; background: var(--paper); }
.stubs .t::before { top: -6px; } .stubs .t::after { bottom: -6px; }
.stubs .what { padding: 12px 14px; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.stubs .what em { font-style: normal; font-size: 14.5px; color: var(--soft); }
.stubs .what > span:nth-child(2) { font-family: var(--font-head); font-stretch: 80%; font-weight: 750; font-size: 20px; line-height: 1.15; }
.stubs .mark { align-self: flex-start; margin-bottom: 4px; font-family: var(--font-head); font-stretch: 70%; font-weight: 900; font-size: 13px; letter-spacing: .03em; text-transform: uppercase;
  color: var(--deal); border: 1.5px solid var(--deal); border-radius: 4px; padding: 0 5px; transform: rotate(-6deg); opacity: .85; }
.insight { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }

.trychip { border: 1.5px solid var(--deal); border-radius: 999px; background: transparent; color: var(--deal); font-weight: 700; padding: 8px 16px; min-height: 44px; }

  mask: conic-gradient(#000 calc(var(--p) * 1turn), transparent 0) intersect, radial-gradient(circle closest-side, transparent 72%, #000 73%); }

.appicon { width: 54px; height: 54px; border-radius: 15px; background: linear-gradient(135deg, #F2A53A, #D9465F 60%, #7B3FD1); flex: none; display: grid; place-items: center; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--rule);
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }

<script>
/* ---------- negotiation rules (mirrors docs/specs/001-negotiation-rules.md) ---------- */
const FLOOR = 2, TRADE_CAP = 15;
function nextOf(s, type) { return s.blocks.slice(s.idx + 1).find(b => b.type === type); }
function makeOffer(s) {
  const override = { kind: "override", addMin: 5 };
  if (s.askCount === 0) return { terms: [{ kind: "freebie", addMin: 5 }], requiresIntention: false, override };

  const group = $(".terms[role=radiogroup]"); if (group) group.onkeydown = e => {

    const n = group.querySelectorAll("[data-term]").length; sheet.pick = (sheet.pick + (e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : n - 1)) % n; nextFocus = `[data-term="${sheet.pick}"]`; render();
  };
  document.querySelectorAll("[data-sug]").forEach(b => b.onclick = () => { sheet.draft = b.dataset.sug; sheet.typing = false; render(); });
  const intent = $("#intent"); if (intent) { intent.oninput = e => { sheet.typed = e.target.value; $("#cont").disabled = !e.target.value.trim(); }; intent.onkeydown = e => { if (e.key === "Enter" && e.target.value.trim()) { sheet.intention = e.target.value.trim(); nextFocus = '[data-term="0"]'; render(); } }; }
  on("#bonusyes", () => takeBonus());
  on("#bonusno", () => { S.bonusOffered = true; nextBlock(); render(); });
  on("#moretime", () => { sheet.paused = true; nextFocus = "#bonusyes"; render(); });
  on("#tryit", () => { tried = true; render(); });
  document.querySelectorAll("[data-ci]").forEach(b => b.onclick = () => { checkin = b.dataset.ci; render(); });
}
function on(sel, fn) { const el = $(sel); if (el) el.onclick = fn; }
function seal() {
  const offer = makeOffer(S), i = sheet.pick || 0, t = document.querySelector(`[data-term="${i}"]`);
  if (t) t.classList.add("stamped");
  document.querySelectorAll(".sheet button").forEach(x => x.disabled = true);
  setTimeout(() => take(offer.terms[i]), reduce ? 0 : 550);
}
function take(term) { ledger.push(applyTerm(S, term, sheet && sheet.intention)); closeSheet(); say(`Deal. ${cur().label} for ${minsLeft()} more minutes.`); render(); restoreFocus(); }
function dismiss() { if (!sheet) return; if (sheet.kind === "bonus") { S.bonusOffered = true; nextBlock(); } else if (remaining() <= 0) nextBlock(); else closeSheet(); render(); restoreFocus(); }
function restoreFocus() { const t = opener && document.body.contains(opener) ? opener : document.querySelector(".stack button, #view h1"); if (t) { if (!t.matches("button")) t.tabIndex = -1; t.focus({ preventScroll: true }); } }
function takeBonus() {
  cur().min += 10; S.durMs += 10 * 60000; const nb = nextOf(S, "break"); if (nb) nb.min += 3;
  ledger.push({ t: clockStr(), kind: "bonus", text: `10 more min of ${shortTask()}`, note: "" }); S.bonusOffered = true; closeSheet(); render(); restoreFocus();
}
document.addEventListener("keydown", e => {
  if (!sheet) return;
  if (e.key === "Escape") { e.preventDefault(); dismiss(); }
  if (e.key === "Tab") {
    const f = [...document.querySelectorAll(".sheet button, .sheet input")]; if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement.id === "sh")) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

const focusTitle = () => { const h = $("#view h1"); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } };
$("#tab-now").onclick = () => { setTab("now"); lastSig = ""; render(); focusTitle(); };
$("#tab-ledger").onclick = () => { setTab("ledger"); render(); focusTitle(); };
$("#tab-room").onclick = () => { setTab("room"); render(); focusTitle(); };
$("#sp1").onclick = () => { speed = 1; $("#sp1").setAttribute("aria-pressed", "true"); $("#sp30").setAttribute("aria-pressed", "false"); };
$("#sp30").onclick = () => { speed = 30; $("#sp30").setAttribute("aria-pressed", "true"); $("#sp1").setAttribute("aria-pressed", "false"); };
$("#jump").onclick = () => { if (S) vnow = S.startedAt + S.durMs - 1000; };
$("#reset").onclick = () => { fresh(); mode = "start"; setTab("now"); history.replaceState(null, "", location.pathname); render(); };

/* ---------- clock loop: re-render only on structural change, update numbers in place ---------- */
let lastSig = "";
function updateCountdown() {
  if (!sheet || sheet.kind !== "bonus") return;
  const left = Math.max(0, Math.min(30, 30 - (Date.now() - sheet.at) / 1000));
  const cd = $("#cd"); if (cd) cd.style.width = (left / 30 * 100).toFixed(1) + "%";
}
function tick() {
  const now = performance.now(); vnow += (now - lastReal) * speed; lastReal = now;
  if (S && tab === "now") {
    const r = remaining(), b = cur();
    if (r <= 0 && !sheet) {
      if (b.type === "break") openSheet({ kind: "boundary", asking: false });
      else if (!S.bonusOffered && S.idx < S.blocks.length - 1) openSheet({ kind: "bonus", at: Date.now() });
      else nextBlock();
    }
    if (sheet && sheet.kind === "bonus") {
      const a = document.activeElement, inside = a && a.closest && a.closest(".sheet") && a.id !== "sh";
      if (inside) sheet.at = Math.max(sheet.at, Date.now() - 20000);
      if (!sheet.paused && Date.now() - sheet.at > 30000) { S.bonusOffered = true; nextBlock(); }
      updateCountdown();
    }
    const heads = r <= 120000 && r > 0;
    const sig = [S.idx, heads, r <= 0, sheet && sheet.kind, sheet && sheet.asking, !!toast].join("|");
    if (sig !== lastSig) { if (lastSig && heads && !sheet) say(`2 minutes left of ${b.label}.`); lastSig = sig; render(); }
    else {
      const m = minsLeft(), mins = $("#mins"), d = $(".dial"), f = face(r, m);
      if (mins && mins.textContent !== f.big) { mins.textContent = f.big; mins.className = "big " + f.cls; $("#unit").textContent = f.unit; if (m !== +d.dataset.m) { d.dataset.m = m; d.setAttribute("aria-label", `${m} minutes left`); } if (reduce) d.style.setProperty("--p", (r / S.durMs).toFixed(4)); }
      if (d && !reduce && !S.justStarted) d.style.setProperty("--p", (r / S.durMs).toFixed(4));
    }
  }
  requestAnimationFrame(tick);
}

/* ---------- hash entry points (for interviews and screenshots) ---------- */
function seedLedger() {
  ledger = [
    { t: "9:12pm", kind: "freebie", text: "5 more min of Reels", note: "" },
    { t: "9:58pm", kind: "bonus", text: "10 more min of reading", note: "" },
    { t: "10:31pm", kind: "borrow", text: "5 more min of TikTok", note: "" },
    { t: "10:37pm", kind: "trade", text: "5 more min of TikTok", note: "Do problem 4" },
  ];
}
function fromHash() {
  const h = location.hash.slice(1);
  fresh(); mode = "start"; setTab("now");
  const run = (left, ask) => { S = buildSession(deal); S.startedAt = vnow - (S.durMs - left); S.askCount = ask || 0; };
  if (h === "intercept") mode = "intercept";
  else if (h === "running") run(6.3 * 60000);
  else if (h === "heads-up") run(100000);
  else if (h === "boundary") { run(0); sheet = { kind: "boundary", asking: false, focusMe: true }; }
  else if (h === "offer-free") { run(0); sheet = { kind: "boundary", asking: true, focusMe: true }; }
  else if (h === "offer-terms") { run(0, 1); sheet = { kind: "boundary", asking: true, focusMe: true }; }
  else if (h === "offer-intention") { run(0, 2); sheet = { kind: "boundary", asking: true, focusMe: true }; }
  else if (h === "bonus") { run(9 * 60000); S.idx = 1; S.durMs = cur().min * 60000; S.startedAt = vnow - S.durMs; sheet = { kind: "bonus", at: Date.now(), focusMe: true }; }
  else if (h === "focus") { run(9 * 60000); S.idx = 1; S.durMs = cur().min * 60000; S.startedAt = vnow - S.durMs * .4; }
  else if (h === "ledger") { seedLedger(); setTab("ledger"); }
  else if (h === "room") setTab("room");
  lastSig = S ? [S.idx, remaining() <= 120000 && remaining() > 0, remaining() <= 0, sheet && sheet.kind, sheet && sheet.asking, false].join("|") : "";
  render();
}
window.addEventListener("hashchange", fromHash);
fromHash();
requestAnimationFrame(tick);
</script>
