/* moving it restarts its animations: it has already landed, so it stays as it is */
.primary#shake.pressed.freed::after { animation: none; }
/* the stamped ticket shrinks into the session's header chip, so you see where the deal went */
/* the new running ticket: its words settle into place under the arriving stamp; the ring winds once the stamp is on its way */
/* the head row itself never moves: at a desk the DEAL stamp is placed against the whole ticket, and a transform here
   would make the head its frame for as long as the move lasted */
.now.dealin > :not(.nowhead), .now.dealin .kind { animation: settle .32s var(--lag, 0ms) ease-out backwards; }
/* a ring always winds on from empty with the knob riding its leading edge: a new session, a new block, minutes you
   just bought. This one move drives the ring's own --p (a registered property that only repaints the ring's mask),
   the single exception to transform/opacity (docs/decisions/0004). Gentle and short, so it never reads as a loading spinner. */
.dial.sweep { animation-duration: .6s; animation-delay: .12s; animation-fill-mode: backwards; animation-timing-function: cubic-bezier(.3, .7, .2, 1); }
.ticket.stamped { animation: hit .3s .2s ease-out; }

/* 2. block change: whatever was left of the old ring lifts off; once the sheet is out of the way the new ring winds on
   in its own material (solid green for focus, the hatch for a break). The words stay readable throughout. */
.dial .was { z-index: 1; pointer-events: none; animation: ring-out .3s var(--lag, 0ms) cubic-bezier(.4, 0, .7, .4) forwards; }
.dial.turn { animation: sweep .6s calc(var(--lag, 0ms) + 140ms) cubic-bezier(.3, .7, .2, 1) backwards; }
/* after a deal, the minutes you bought wind onto the empty ring as the sheet leaves */
.dial.wind { animation: sweep .55s calc(var(--lag, 0ms) + 160ms) cubic-bezier(.3, .7, .2, 1) backwards; }
.dial.turn :is(.edge, .face) { z-index: 2; }
/* the words are readable from the first frame: they only settle into place, they never fade */
.dial.turn .face > *, .now.turn > :not(h1, .nowhead), .now.turn .kind { animation: settle .3s var(--lag, 0ms) ease-out backwards; }
/* the title is fed like a ticket: the old one leaves up through the top edge of its line, the new one rises in from
   under the bottom edge. Each is clipped to the line it is crossing, so nothing fades and nothing overlaps. */
.now.turn h1 { position: relative; }
.now.turn h1 .isname { display: block; animation: feed-up .34s calc(var(--lag, 0ms) + 170ms) cubic-bezier(.2, .7, .2, 1) backwards; }
.now.turn h1 .wasname { position: absolute; left: 0; top: 0; width: 100%; animation: feed-off .2s var(--lag, 0ms) cubic-bezier(.5, 0, .8, .4) forwards; }
@keyframes feed-up { from { transform: translateY(100%); clip-path: inset(0 0 100% 0); } to { transform: none; clip-path: inset(0 0 -20% 0); } }
@keyframes feed-off { to { transform: translateY(-100%); clip-path: inset(100% 0 -20% 0); } }
@keyframes ring-out { to { opacity: 0; transform: scale(1.045); } }
@keyframes settle { from { transform: translateY(6px); } }

/* 3. heads-up and time-up: the number in the dial is re-inked once, like a fresh stamp: pressed in a touch large,
   it settles. No flashing, nothing that repeats. At time-up the sheet comes up at the same moment. */
.face.reink .big { animation: reink .44s var(--lag, 0ms) linear backwards; }
@keyframes reink {
  0% { transform: translateY(-4%) scale(1.12); animation-timing-function: cubic-bezier(.6, 0, .9, .4); }
  34% { transform: scale(.94); animation-timing-function: cubic-bezier(.2, .7, .3, 1); }
  62% { transform: scale(1.02); }
  100% { transform: none; }
}
/* the words under it print left to right once the number has landed, like a line from the tape */
.face.reink .unit { animation: type-on .36s calc(var(--lag, 0ms) + 170ms) steps(12, end) backwards; }
@keyframes type-on { from { clip-path: inset(0 100% 0 0); } }
.act.fresh > * { animation: settle .3s var(--lag, 0ms) ease-out backwards; }

/* sheets rise from the bottom edge and slide back down when they close. The dimming is its own layer, so fading it
   never makes the sheet see-through. */
.scrim { background: none; }
.scrim::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--scrim); }
.scrim.rise::before { animation: fade .2s var(--lag, 0ms) ease-out backwards; }
.scrim.rise .sheet { animation: sheet-in .34s var(--lag, 0ms) cubic-bezier(.2, .8, .2, 1) backwards; }
.scrim.rise.calm::before { animation-duration: .36s; }
.scrim.rise.calm .sheet { animation-duration: .4s; }
/* at time-up the used half tears and is marked once the sheet has arrived, not while it is still moving */
.scrim.rise.calm .tearrow .used { animation-delay: calc(var(--lag, 0ms) + 260ms); }
.scrim.rise.calm .tearrow .usedwrap .stamp { animation-delay: calc(var(--lag, 0ms) + 380ms); }
/* "Used" is a postmark, not an approval: it lands lighter than DEAL, no squash, no rebound */
.tearrow .usedwrap .stamp { animation-name: post; animation-duration: .34s; animation-timing-function: ease-out; }
@keyframes post { from { transform: scale(1.08) rotate(var(--tilt)); opacity: 0; } 45% { opacity: 1; } to { transform: rotate(var(--tilt)); opacity: 1; } }
.scrim.leaving { pointer-events: none; }
.scrim.leaving::before { animation: fade-out .16s ease-in forwards; }
.scrim.leaving .sheet { animation: sheet-out .24s cubic-bezier(.5, 0, .8, .4) forwards; }
@keyframes fade { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes sheet-in { from { transform: translateY(100%); } }
@keyframes sheet-out { to { transform: translateY(100%); } }

/* 4. asking for time: the terms come off the pad one by one, pivoting on their perforated edge. The one you tap is
   stamped, lifts a little, and the others fall away before the sheet closes. */
.terms.deal-in > .term { transform-origin: 0 50%; animation: tear-in .34s calc(var(--lag, 0ms) + 30ms) cubic-bezier(.2, .8, .2, 1) backwards; }
.terms.deal-in > .term:nth-child(2) { animation-delay: calc(var(--lag, 0ms) + 90ms); }
@keyframes tear-in { from { opacity: 0; transform: translateX(-12px) rotate(-3deg); } 70% { transform: rotate(.5deg); } }
.terms.picking > .term:not(.stamped) { animation: fall .26s .32s cubic-bezier(.5, 0, .8, .4) forwards; }
.terms.picking > .term.stamped { animation: hit .3s .2s ease-out, lift .22s .48s ease-out forwards; }
/* taking a term: the stamp lifts off its stub at once (you see it answer the press), comes down hard at 200 ms, squashes,
   rebounds and settles. On impact the ink appears, the ticket is driven down and the whole sheet takes the knock. */
.term.stamped .pad .stamp { transition: none; animation: slam .62s linear both; }
.term.stamped .pad .stamp::after { animation: inked .3s .2s ease-out backwards; }
@keyframes slam {
  0% { transform: rotate(var(--tilt)); animation-timing-function: cubic-bezier(.2, .6, .4, 1); }
  20% { transform: translateY(-10px) scale(1.24) rotate(calc(var(--tilt) - 9deg)); filter: drop-shadow(0 10px 6px var(--lift)); animation-timing-function: cubic-bezier(.7, 0, 1, .5); }
  32% { transform: scale(.88) rotate(calc(var(--tilt) + 1.5deg)); filter: none; animation-timing-function: cubic-bezier(.2, .7, .3, 1); }
  52% { transform: scale(1.05) rotate(calc(var(--tilt) - .6deg)); }
  74% { transform: scale(.99) rotate(var(--tilt)); }
  100% { transform: rotate(var(--tilt)); }
}
@keyframes inked { from { opacity: .5; } }
@keyframes hit { 30% { transform: translateY(3px) scale(.994); } }
.sheet.knock { animation: knock .22s .2s ease-out; }
@keyframes knock { 30% { transform: translateY(2px); } }
@keyframes fall { to { opacity: 0; transform: translateY(10px) rotate(1.5deg); } }
@keyframes lift { to { transform: translateY(-3px) scale(1.012); } }

/* 5. ledger: the newest stub, already stamped, drops onto the top of the pile. The tab's count pops once. */
/* the tape feeds out a new line under "now": the gap opens at the speed of a receipt printer, the line rides down
   into it (pushing tonight's earlier deals down), and once it is out its stamp is inked. It waits for the sheet to leave. */
.stubcard.fresh { overflow: hidden; animation: feed .46s calc(var(--lag, 0ms) + 240ms) cubic-bezier(.3, .55, .25, 1) backwards; }
.stubcard.fresh > * { animation: feed-in .46s calc(var(--lag, 0ms) + 240ms) cubic-bezier(.3, .55, .25, 1) backwards; }
.stubcard.fresh .stamp { animation: ink .5s calc(var(--lag, 0ms) + 700ms) linear backwards; }
@keyframes feed { from { max-height: 0; border-top-color: transparent; } to { max-height: var(--h, 160px); } }
@keyframes feed-in { from { transform: translateY(calc(-1 * var(--h, 160px))); } }
/* the older stubs start where they were and are pushed down by the new one (--push is its height, set after render) */
@keyframes pop { from { transform: scale(.4); opacity: 0; } }



/* ---------- the stamp is the action ----------
   You do not press a button under the deal, you stamp it. The Deal control is the stamp's face: outlined and clean while it
   waits, slammed and inked when you press. It then travels to the head of the running ticket. */
.primary:is(#shake, #print) { position: relative; display: block; width: auto; min-width: 220px; min-height: 100px; margin: 6px auto 4px; padding: 6px 34px 4px; background: none; box-shadow: none; color: var(--deal); border-radius: 10px;
  font-size: 2.75rem; font-weight: 800; font-stretch: var(--wd-display); letter-spacing: .07em; text-transform: uppercase; line-height: 1; --tilt: -3deg; transform: rotate(var(--tilt)); transition: transform .12s ease-out; }
.primary:is(#shake, #print)::before { content: ""; position: absolute; inset: 0; border: 7px double currentColor; border-radius: 10px; }
/* benchmark r4: at rest DEAL is the die itself, solid green, its letters and rule in the paper's colour */
.primary:is(#shake, #print):not(:disabled) { background: var(--die, var(--deal)); color: var(--on-die, var(--card)); }
.primary:is(#shake, #print):not(:disabled)::before { inset: 6px; border-width: 4px; border-radius: 6px; border-color: var(--die-rule, currentColor); }
.primary:is(#shake, #print):hover:not(:disabled) { transform: rotate(-3deg) scale(1.03); }
.primary:is(#shake, #print):active:not(:disabled) { transform: rotate(-3deg) scale(.96); }
.primary:is(#shake, #print):disabled:not(.pressed) { color: var(--soft); }
.primary:is(#shake, #print).pressed { animation: slam .62s linear both; }
/* on impact the face takes ink: a wash of the stamp's colour through the same texture */
.primary:is(#shake, #print)::after { content: ""; position: absolute; inset: 0; border-radius: 10px; background: currentColor; opacity: 0; -webkit-mask: var(--noise) 0 0 / 120px 60px; mask: var(--noise) 0 0 / 120px 60px; pointer-events: none; }
.primary:is(#shake, #print).pressed::after { opacity: .14; animation: inked .3s .2s ease-out backwards; }
.primary:is(#shake, #print).pressed::before { -webkit-mask: var(--noise) 0 0 / 120px 60px; mask: var(--noise) 0 0 / 120px 60px; }
#ticket .stampbox { display: none; }
/* Print waits like any stamp that can't be pressed yet: dashed, in ink */
.primary#print:disabled:not(.pressed)::before { border: 2px dashed var(--wait-edge); }

/* ---------- spec 012: tonight in a line ----------
   Tonight is written the way a deal is: one sentence on the ticket. What you type closes into underlined words at each
   comma; the open end of the sentence is where the next one goes. Printed, the sittings wait at the top of the tape. */
.tickethead #plannight { flex: none; margin: -10px -12px -10px auto; }
.ticket.night .sentence { font-size: 1.25rem; line-height: 1.45; text-wrap: pretty; }
.ticket.night .sentence .item::before { content: "\A"; white-space: pre; }
/* the underline scales with the type, so five stacked words read as a sentence, not stripes (one style for every changeable word) */
.ticket.night .sentence .tok { text-decoration-thickness: .085em; text-underline-offset: .17em; }
.ticket.night .sentence .nsz { white-space: nowrap; }
.ticket.night .sentence .lead { color: var(--ink); font-size: 1.25em; font-weight: 800; }
.ticket.night .sentence .tok { font-size: 1.2em; }
.nightin[size="1"] { min-width: 0; width: .6ch; padding: 0; }
.nightin { font: inherit; font-size: 1.2em; font-weight: 700; line-height: 1.2; color: var(--ink); background: none; border: none; border-radius: 0; padding: 0 2px; margin: 0; max-width: 100%; min-width: 2ch; outline: none; caret-color: var(--deal); vertical-align: baseline; }
.nightin[size="1"]:focus { width: 3ch; }
.nightin::placeholder { color: color-mix(in srgb, var(--ink) 42%, transparent); font-weight: 500; }
.nightin:focus-visible { outline: none; }
.ticket.night .nightfit { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-top: 2px; font-size: 1rem; line-height: 1.35; color: var(--soft); }
.nightfit b { flex: none; font-family: var(--font-head); font-stretch: var(--wd-display); font-weight: 800; font-size: 2.75rem; line-height: .82; letter-spacing: -.01em; color: var(--ink); font-variant-numeric: tabular-nums; }
.nightfit b small { font-size: .42em; font-weight: 700; margin-left: 2px; letter-spacing: 0; }
.nightname { flex: 1 1 220px; }
#night-picker[role="radiogroup"] { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
#night-picker[role="radiogroup"] .longrow { grid-column: 1 / -1; display: grid; grid-template-columns: inherit; gap: 8px; margin: 2px 0 0; padding-top: 10px; }
#night-picker[role="radiogroup"] .chip { justify-content: center; white-space: nowrap; }
.ticketwrap + .onedeal { align-self: center; margin: -6px auto -10px; }
/* the rest of tonight, said under the ticket where the quiet line goes */
.nightrest { align-self: stretch; margin: -6px 0 6px; padding-left: 2px; font-size: 1rem; line-height: 1.4; color: var(--soft); text-wrap: pretty; }
.nightrest b { font-weight: 400; white-space: nowrap; }
/* digits inside a name are Archivo numerals, as in every sentence (no slashed zero) */
.nightrest b .num { font-family: var(--font-head); font-stretch: var(--wd-act); font-weight: 600; }
.nightrest .at { font-family: var(--font-head); font-stretch: var(--wd-act); font-weight: 700; color: var(--ink); }
/* the unprinted top of the tape: tonight's sittings, lengths where the times go, one faint ink but the next one */
.tocome { display: flex; flex-direction: column; }
.tocome.draft li, .tocome.draft h3 span b { color: color-mix(in srgb, var(--ink) 38%, transparent); }
.tocome.draft .nightstrip { opacity: .5; }
.nightstrip { display: flex; gap: 3px; height: 9px; margin: 2px 0 6px; }
.nightstrip .ns { display: block; min-width: 4px; border-radius: 2px; }
.nightstrip .ns.f { background: color-mix(in srgb, var(--ink) 70%, transparent); }
.nightstrip .ns.f.next { background: var(--ink); }
.nightstrip .ns.f.paid { background: var(--deal); }
.nightstrip .ns.b { background: repeating-linear-gradient(135deg, var(--break-stripe) 0 1.5px, transparent 1.5px 4px), var(--break-base); opacity: .5; }
.nightstrip.onticket { margin: 8px 0 0; height: 8px; }
.nightstrip.onsheet { margin: 2px 0 -6px; height: 8px; }
.nightmap { display: none; }
@media (min-width: 820px) {
  .nightstrip.onticket { display: none; }
  .nightmap { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .nmhead { display: flex; justify-content: space-between; align-items: baseline; font-size: 1rem; color: var(--soft); }
  .nmhead b { font-family: var(--font-head); font-stretch: var(--wd-display); font-weight: 800; font-size: 2.5rem; line-height: .9; color: var(--ink); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .nmhead b small { font-size: .42em; font-weight: 700; margin-left: 2px; }
  .nightstrip.named { height: auto; gap: 4px; align-items: flex-end; }
  .nightstrip.named .ns.f { display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; min-width: 0; background: none; border-radius: 0; }
  .nightstrip.named .ns.f::after { content: ""; display: block; height: 12px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 70%, transparent); }
  .nightstrip.named .ns.f.next::after { background: var(--ink); }
  .nightstrip.named .ns.f.paid::after { background: var(--deal); }
  .nightstrip.named .ns.f b { font-family: var(--font-head); font-stretch: var(--wd-display); font-weight: 750; font-size: 1.0625rem; line-height: 1.1; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nightstrip.named .ns.f em { font-style: normal; font-size: .875rem; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nightstrip.named .ns.f.paid b { color: var(--soft); }
  .nightstrip.named .ns.b { height: 12px; align-self: flex-end; }
}
.tocome .nightstrip { height: 7px; margin: 4px 0 8px; }
.tocome h3 { margin: 0 0 4px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-family: var(--font-head); font-stretch: var(--wd-display); font-weight: 800; font-size: 1.5rem; }
.tocome h3 span { font-stretch: var(--wd-act); font-weight: 600; font-size: .9375rem; color: var(--soft); }
.tocome h3 span b { font-stretch: var(--wd-display); font-weight: 800; font-size: 1.375rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.tocome ol { list-style: none; margin: 0; padding: 0; }
.tocome li { display: grid; grid-template-columns: 5.25em 1fr; padding: 11px 0 10px; border-top: 1.5px dashed var(--edge-half); color: color-mix(in srgb, var(--ink) 52%, transparent); }
.tocome li b { font-family: var(--font-head); font-stretch: var(--wd-act); font-weight: 600; font-size: 1.0625rem; line-height: 1.2; }
/* planned: the Done stamp hasn't landed. Its place waits as the deal ticket's empty stamp box does: a dashed outline
   with the stamp's ghost in it, tilted where the stamp will fall */
.tocome li { grid-template-columns: 5.25em 1fr auto; }
.tocome li .wait { align-self: center; position: relative; width: 58px; height: 26px; border: 1.5px dashed color-mix(in srgb, var(--ink) 30%, transparent); border-radius: 5px; transform: rotate(-4deg); }
.tocome li .wait .stamp { position: absolute; inset: 0; font-size: .9375rem; opacity: .16; filter: grayscale(1); --tilt: 0deg; }
.tocome li .wait .stamp::before { display: none; }
.tocome li.next .wait { border-color: var(--wait-edge); }
.tocome.draft li .wait { opacity: .6; }
.tocome li .nm { font-family: var(--font-head); font-stretch: var(--wd-display); font-weight: 750; font-size: 1.25rem; line-height: 1.15; }
.tocome li em { display: block; font-style: normal; font-size: .9375rem; line-height: 1.35; margin-top: 2px; }
.tocome li.next { color: var(--ink); }
.tocome li.next em { color: var(--soft); }
.tocome .tcperf { height: 10px; margin: 8px 0 -6px; background: radial-gradient(circle, var(--edge) 1.5px, transparent 2px) 50% 50% / 10px 6px repeat-x; }
.stub.perf .hint { margin-top: 6px; }

/* ---------- the room on paper ----------
   Each friend is the stub of the ticket they are on: their wheel on the stub end, what they are doing, how long is left.
   A check-in is a stamp you put on your own. */
/* spec 011: the room is one roster on one sheet of ticket paper, a hairline between people, not a stack of stubs */
.roster { filter: var(--paper-shadow); }
.people { gap: 0; background: var(--card); border-radius: 6px 0 0 6px; padding: 4px 3px 4px 0; -webkit-mask: var(--zig); mask: var(--zig); }
.person, .person + .person, .person.you, .person:last-child { border: none; }
.person { padding: 10px 18px 10px 14px; min-height: 72px; grid-template-columns: 56px 1fr auto; gap: 14px; }
.person + .person { border-top: 1px solid var(--edge-half); }
.person .who { align-self: stretch; display: flex; flex-direction: column; justify-content: center; }
.person.you { background: var(--stub); border-radius: 6px 0 0 0; margin-top: -4px; padding-top: 14px; }
.person { --track: color-mix(in srgb, var(--deal) 8%, color-mix(in srgb, var(--ink) var(--track-ink), var(--card))); }
.presence { --track: color-mix(in srgb, var(--ink) 22%, var(--paper)); }
.pills { gap: 14px; padding: 6px 4px 2px; }
.pills .chip { position: relative; border-radius: 6px; background: none; box-shadow: none; color: var(--soft); font-family: var(--font-head); font-stretch: var(--wd-display); font-weight: 800; font-size: 1.125rem; letter-spacing: .05em; text-transform: uppercase; min-height: 48px; }
.pills .chip::before { content: ""; position: absolute; inset: 0; border: 4px double currentColor; border-radius: 6px; }
.pills .chip:nth-child(1) { transform: rotate(-2deg); } .pills .chip:nth-child(2) { transform: rotate(1.5deg); } .pills .chip:nth-child(3) { transform: rotate(-1deg); }
.pills .chip[aria-checked="true"] { background: none; color: var(--deal); box-shadow: none; }
.pills .chip[aria-checked="true"]::before { -webkit-mask: var(--noise) 0 0 / 120px 60px; mask: var(--noise) 0 0 / 120px 60px; }
.pills .chip svg { display: none; }

/* ---------- sheets are paper ----------
   No grab handle and no rounded corners: a sheet is a length of paper fed up from the bottom, torn across its top. */
.sheet:not(.paper) { border-top: none; border-radius: 0; padding-top: 26px;
  -webkit-mask: var(--tear-top);
  mask: var(--tear-top); }
.grab { display: none; }

/* ---------- the desk (wide windows) ----------
   Two things on a desk: the clock you are dealing with, large, and tonight's tape hanging from the top edge of the window.
   No header bar, no columns of widgets. The room stays one line under the clock, as on a phone, and opens in the stage. */
@media (min-width: 820px) {
  :root { --pad: clamp(28px, 5vw, 72px); --gap: clamp(28px, 4vw, 64px); --tapew: clamp(300px, 28vw, 380px); --stagetop: clamp(14px, 3vh, 30px); --appw: 1360px; }
  .app { max-width: var(--appw); padding-inline: var(--pad); }
  /* spec 011 (council r3): read from a chair, not a hand. Type a step up on a full-size desk; the phone is untouched. */
  @media (min-width: 1200px) and (min-height: 760px) { html { font-size: 106.25%; } }
  /* the deal you are about to stamp is a landscape ticket at a desk, built like the terms: what you agree to on the
     left, the stub with the DEAL stamp on the right past a perforation. It uses the stage's width instead of a column. */
  .ticket { display: grid; grid-template-columns: minmax(0, 1fr) clamp(250px, 34cqw, 300px); }
  .ticket .body { padding: 26px 32px 30px 30px; justify-content: center; }
  .ticket .stub, .ticket .stub.perf { padding: 26px 26px 22px 30px; justify-content: center; align-items: center; text-align: center; background: radial-gradient(circle, var(--edge) 1.5px, transparent 2px) 0 0 / 6px 10px repeat-y; }
  .ticket .stub.perf::before { top: -7px; left: -4px; clip-path: inset(50% 0 0 0); }
  .ticket.big .stub { position: relative; bottom: auto; background: radial-gradient(circle, var(--edge) 1.5px, transparent 2px) 0 0 / 6px 10px repeat-y, var(--card); }
  .ticket .stub .primary:is(#shake, #print) { font-size: 3.25rem; }
  .ticket.night .sentence { font-size: 1.875rem; line-height: 1.38; }
  /* on a desk the tape beside the ticket already says the rest of the night */
  .nightrest { display: none; }
  main:not(:has(> .runwrap)) { min-height: calc(100dvh - 60px); justify-content: flex-start; padding-top: calc(50px + var(--stagetop) + clamp(40px, 13vh, 150px)); padding-bottom: 96px; }
  /* above the stage, which is pulled up under it: the floating-wheel control up here has to take clicks */
  .deskhead { position: relative; z-index: 2; display: flex; align-items: baseline; gap: 14px; padding-top: 30px; font-family: var(--font-head); font-stretch: var(--wd-display); font-weight: 800; font-size: 1.25rem; line-height: 1; color: var(--soft); }
  .deskhead .mark { color: var(--ink); }
  .deskhead .day { font-family: var(--font-body); font-weight: 400; font-stretch: normal; font-size: .9375rem; }
  .desk { display: grid; grid-template-columns: minmax(0, 1fr) var(--tapew); grid-template-areas: "stage tape"; align-items: start; column-gap: var(--gap); margin-top: -50px; }
