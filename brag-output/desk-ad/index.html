<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/archivo-var.woff2") format("woff2"); font-weight: 400 900; font-stretch: 62% 125%; }
      @font-face { font-family: "Atkinson Hyperlegible"; src: url("assets/fonts/atkinson-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Atkinson Hyperlegible"; src: url("assets/fonts/atkinson-700.woff2") format("woff2"); font-weight: 700; }
      /* Pomodeal's own tokens (prototypes/quick-deal/index.html) */
      :root { --paper: #cdd5ca; --card: #fefefa; --ink: #1b211d; --deal: #0e7447; --on-deal: #f4f7f1; --soft: #4d5a52; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Atkinson Hyperlegible", sans-serif; }
      .full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .head { font-family: "Archivo", sans-serif; font-stretch: 68%; font-weight: 800; letter-spacing: -0.012em; }

      /* the lockup that stays at the top of every product scene */
      #lockup { position: absolute; left: 0; top: 172px; width: 1080px; height: 96px; z-index: 5; }
      #lockup-in { display: flex; align-items: center; justify-content: center; gap: 22px; height: 96px; }
      #lockup-in img { width: 92px; height: 92px; display: block; }
      #lockup-in span { font-size: 88px; line-height: 1; }

      /* captions: one fixed place, between the lockup and the product */
      .cap { position: absolute; left: 40px; top: 296px; width: 1000px; height: 150px; z-index: 6; display: flex; align-items: center; justify-content: center; text-align: center; }
      .cap span { display: block; font-size: 70px; line-height: 1.04; }

      /* scene 1: the excuse */
      #hook { z-index: 4; }
      #quote { position: absolute; left: 130px; top: 600px; width: 900px; font-size: 172px; line-height: 0.98; font-stretch: 64%; }
      #quote .hang { display: block; margin-left: -0.42em; }
      #stampwrap { position: absolute; left: 372px; top: 1150px; width: 620px; height: 300px; z-index: 8; }
      .stamp { width: 100%; height: 100%; border-radius: 26px; background: var(--deal); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 10px var(--deal), inset 0 0 0 16px var(--on-deal); }
      .stamp b { font-family: "Archivo", sans-serif; font-stretch: 78%; font-weight: 800; font-size: 190px; letter-spacing: 0.05em; color: var(--on-deal); line-height: 1; }

      /* green sheets: the name, and the end card */
      .sheet { z-index: 20; }
      .sheet-in { position: absolute; left: 0; top: 0; width: 1080px; height: 1980px; background: var(--deal); color: var(--on-deal);
        -webkit-mask: radial-gradient(circle 22px at 30px 100%, transparent 21px, #000 22px) 0 0 / 60px 100%; mask: radial-gradient(circle 22px at 30px 100%, transparent 21px, #000 22px) 0 0 / 60px 100%; }
      .mark { position: absolute; left: 390px; width: 300px; height: 300px; }
      .mark svg { width: 300px; height: 300px; display: block; overflow: visible; }
      .word { position: absolute; left: 0; width: 1080px; text-align: center; font-size: 262px; line-height: 1; font-stretch: 62%; white-space: nowrap; }
      .word i { display: inline-block; font-style: normal; }
      .line { position: absolute; left: 60px; width: 960px; text-align: center; }
      #name-mark { top: 520px; } #name-word { top: 850px; }
      #name-line { top: 1140px; font-size: 54px; line-height: 1.2; }
      #end-mark { top: 400px; } #end-word { top: 730px; }
      #end-line { top: 1010px; font-size: 104px; line-height: 1; }
      #end-url { position: absolute; left: 0; top: 1170px; width: 1080px; display: flex; justify-content: center; }
      #end-url span { display: block; background: var(--card); color: var(--ink); font-size: 66px; font-weight: 700; padding: 18px 44px 22px; border-radius: 14px; }
      #end-beta { top: 1312px; font-size: 40px; opacity: 0.9; }

      /* the phone */
      #phone { position: absolute; left: 204px; top: 452px; width: 672px; height: 1417px; z-index: 3; }
      #phone-body { position: absolute; left: 0; top: 0; width: 672px; height: 1417px; border-radius: 84px; background: #161b18; box-shadow: 0 2px 0 rgba(255, 255, 255, 0.35) inset, 0 40px 70px rgba(20, 30, 24, 0.28), 0 6px 14px rgba(20, 30, 24, 0.2); }
      #phone-screen { position: absolute; left: 16px; top: 16px; width: 640px; height: 1385px; border-radius: 68px; overflow: hidden; background: var(--paper); }
      #phone-screen video { position: absolute; left: 0; top: 0; width: 640px; height: 1385px; display: block; }

      /* the desk */
      #desk { position: absolute; left: 0; top: 0; width: 1000px; height: 734px; z-index: 3; }
      #desk-body { width: 1000px; height: 734px; border-radius: 22px; overflow: hidden; background: var(--paper); box-shadow: 0 0 0 3px #161b18, 0 40px 70px rgba(20, 30, 24, 0.28), 0 6px 14px rgba(20, 30, 24, 0.2); }
      #desk-bar { height: 46px; background: #161b18; display: flex; align-items: center; justify-content: center; }
      #desk-bar span { color: #dfe5dc; font-size: 22px; background: rgba(255, 255, 255, 0.12); padding: 3px 26px 5px; border-radius: 8px; }
      #desk-view { position: relative; width: 1000px; height: 688px; overflow: hidden; }
      #desk-view video { position: absolute; left: 0; top: 0; width: 1000px; height: 688px; display: block; }
    </style>
  </head>
    <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.6" data-width="1080" data-height="1920" data-fps="60">
      <div id="lockup" class="clip" data-start="0" data-duration="19.1" data-track-index="1">
        <div id="lockup-in"><img src="assets/brand/icon.svg" alt="" /><span class="head">Pomodeal</span></div>
      </div>

      <!-- the excuse -->
      <div id="hook" class="clip full" data-start="0" data-duration="3.75" data-track-index="2">
        <div id="hook-in" class="full">
          <p id="quote" class="head"><span class="hang">“10 more minutes,</span>then I’ll start.”</p>
          <div id="stampwrap"><div id="stamp" class="stamp"><b id="stamp-word">DEAL</b></div></div>
        </div>
      </div>

      <!-- the name -->
      <div id="name" class="clip full sheet" data-start="3.6" data-duration="3" data-track-index="3">
        <div id="name-in" class="sheet-in">
          <div id="name-mark" class="mark"><svg viewBox="0 0 512 512"><g fill="none" stroke="#f4f7f1" stroke-linecap="round"><circle cx="256" cy="256" r="150" stroke-width="40" stroke-opacity=".28" /><path id="name-arc" pathLength="1" d="M256 106a150 150 0 1 1-130 225" stroke-width="40" /><path d="M256 256l-62-70" stroke-width="30" /><path d="M256 256l96-104" stroke-width="22" /></g><circle cx="256" cy="256" r="20" fill="#f4f7f1" /></svg></div>
          <div id="name-word" class="word head"><i>P</i><i>o</i><i>m</i><i>o</i><i>d</i><i>e</i><i>a</i><i>l</i></div>
          <p id="name-line" class="line">The study timer that<br />negotiates with you.</p>
        </div>
      </div>

      <!-- the desk -->
      <div id="desk" data-layout-allow-overflow>
        <div id="desk-body">
          <div id="desk-bar"><span data-layout-ignore>pomodeal.app</span></div>
          <div id="desk-view">
            <video id="v-desk" class="clip" data-start="6.83" data-duration="12.2" data-track-index="5" muted playsinline src="assets/clips/desk-tonight.mp4"></video>
          </div>
        </div>
      </div>

      <!-- captions -->
      <div id="c1" class="cap clip" data-start="7.0" data-duration="4.7" data-track-index="6"><span class="head">On your laptop: tonight, in one line.</span></div>
      <div id="c2" class="cap clip" data-start="11.9" data-duration="1.4" data-track-index="6"><span class="head">Press Print.</span></div>
      <div id="c3" class="cap clip" data-start="13.5" data-duration="2.8" data-track-index="6"><span class="head">The whole night, laid out to scale.</span></div>
      <div id="c4" class="cap clip" data-start="16.4" data-duration="2.2" data-track-index="6"><span class="head">Then one deal at a time.</span></div>

      <!-- end card -->
      <div id="end" class="clip full sheet" data-start="18.57" data-duration="4.03" data-track-index="7">
        <div id="end-in" class="sheet-in">
          <div id="end-mark" class="mark"><svg viewBox="0 0 512 512"><g fill="none" stroke="#f4f7f1" stroke-linecap="round"><circle cx="256" cy="256" r="150" stroke-width="40" stroke-opacity=".28" /><path id="end-arc" pathLength="1" d="M256 106a150 150 0 1 1-130 225" stroke-width="40" /><path d="M256 256l-62-70" stroke-width="30" /><path d="M256 256l96-104" stroke-width="22" /></g><circle cx="256" cy="256" r="20" fill="#f4f7f1" /></svg></div>
          <div id="end-word" class="word head"><i>P</i><i>o</i><i>m</i><i>o</i><i>d</i><i>e</i><i>a</i><i>l</i></div>
          <p id="end-line" class="line head">Make a deal.</p>
          <div id="end-url"><span>pomodeal.app</span></div>
          <p id="end-beta" class="line">Private beta</p>
        </div>
      </div>

      <!-- sound: music by Sascha Ende, ende.app (CC BY 4.0); effects by Kenney (CC0) -->
      <audio id="music" class="clip" data-start="0" data-duration="22.6" data-track-index="10" data-volume="0.5" data-fade-out="1.4" src="assets/music/happy-beats-business-moves-vol-11-by-ende-dot-app.mp3"></audio>
      <audio id="s-hook" class="clip" data-start="1.58" data-duration="0.57" data-track-index="11" data-volume="1" src="assets/sfx/impactSoft_heavy_001.ogg"></audio>
      <audio id="s-name" class="clip" data-start="3.74" data-duration="0.18" data-track-index="12" data-volume="0.6" src="assets/sfx/impactSoft_medium_001.ogg"></audio>
      <audio id="s-tear" class="clip" data-start="6.0" data-duration="0.5" data-track-index="11" data-volume="0.5" src="assets/sfx/card-slide-1.ogg"></audio>
      <audio id="s-tap1" class="clip" data-start="7.73" data-duration="0.06" data-track-index="12" data-volume="0.8" src="assets/sfx/click2.ogg"></audio>
      <audio id="k1" class="clip" data-start="8.13" data-duration="0.2" data-track-index="14" data-volume="0.4" src="assets/sfx/keypress-001.wav"></audio>
      <audio id="k2" class="clip" data-start="8.39" data-duration="0.2" data-track-index="15" data-volume="0.4" src="assets/sfx/keypress-003.wav"></audio>
      <audio id="k3" class="clip" data-start="8.64" data-duration="0.2" data-track-index="14" data-volume="0.4" src="assets/sfx/keypress-002.wav"></audio>
      <audio id="k4" class="clip" data-start="8.9" data-duration="0.2" data-track-index="15" data-volume="0.4" src="assets/sfx/keypress-005.wav"></audio>
      <audio id="k5" class="clip" data-start="9.15" data-duration="0.2" data-track-index="14" data-volume="0.4" src="assets/sfx/keypress-004.wav"></audio>
      <audio id="k6" class="clip" data-start="9.41" data-duration="0.2" data-track-index="15" data-volume="0.4" src="assets/sfx/keypress-006.wav"></audio>
      <audio id="k7" class="clip" data-start="9.66" data-duration="0.2" data-track-index="14" data-volume="0.4" src="assets/sfx/keypress-001.wav"></audio>
      <audio id="k8" class="clip" data-start="9.92" data-duration="0.2" data-track-index="15" data-volume="0.4" src="assets/sfx/keypress-003.wav"></audio>
      <audio id="k9" class="clip" data-start="10.17" data-duration="0.2" data-track-index="14" data-volume="0.4" src="assets/sfx/keypress-002.wav"></audio>
      <audio id="k10" class="clip" data-start="10.43" data-duration="0.2" data-track-index="15" data-volume="0.4" src="assets/sfx/keypress-005.wav"></audio>
      <audio id="k11" class="clip" data-start="10.68" data-duration="0.2" data-track-index="14" data-volume="0.4" src="assets/sfx/keypress-004.wav"></audio>
      <audio id="k12" class="clip" data-start="10.94" data-duration="0.2" data-track-index="15" data-volume="0.4" src="assets/sfx/keypress-006.wav"></audio>
      <audio id="k13" class="clip" data-start="11.19" data-duration="0.2" data-track-index="14" data-volume="0.4" src="assets/sfx/keypress-001.wav"></audio>
      <audio id="s-tap2" class="clip" data-start="12.33" data-duration="0.06" data-track-index="12" data-volume="0.8" src="assets/sfx/click2.ogg"></audio>
      <audio id="s-print" class="clip" data-start="12.64" data-duration="0.15" data-track-index="11" data-volume="0.85" src="assets/sfx/impactSoft_medium_004.ogg"></audio>
      <audio id="s-tap3" class="clip" data-start="16.53" data-duration="0.06" data-track-index="12" data-volume="0.8" src="assets/sfx/click2.ogg"></audio>
      <audio id="s-deal2" class="clip" data-start="16.84" data-duration="0.57" data-track-index="11" data-volume="0.95" src="assets/sfx/impactSoft_heavy_001.ogg"></audio>
      <audio id="s-logo" class="clip" data-start="19.39" data-duration="1.45" data-track-index="11" data-volume="0.45" src="assets/sfx/impactBell_heavy_000.ogg"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const IN = "expo.out", THRU = "power3.in", CAM = "power2.inOut";
      const knock = (sel, at, by, base = 0) => { tl.to(sel, { y: base + by, duration: 0.05, ease: "power1.out" }, at); tl.to(sel, { y: base, duration: 0.28, ease: "power3.out" }, at + 0.05); };

      /* ---------- the excuse (0 to 3.70) ---------- */
      // beat-locked: 1.60s, the DEAL stamp lands on the first strong cue
      tl.fromTo("#stamp", { scale: 2.7, rotation: -14, opacity: 0 }, { scale: 1, rotation: -5, opacity: 1, duration: 0.2, ease: THRU }, 1.4);
      knock("#quote", 1.6, 10);
      tl.to("#stamp", { scale: 0.965, duration: 0.05, ease: "power1.out" }, 1.6);
      tl.to("#stamp", { scale: 1, duration: 0.22, ease: "power3.out" }, 1.65);
      // zoom through the stamp: its green becomes the next scene
      tl.to("#stamp-word", { opacity: 0, duration: 0.14, ease: "power1.in" }, 3.4);
      tl.to("#stamp", { scale: 9, rotation: 0, duration: 0.3, ease: THRU }, 3.4);

      /* ---------- the name (3.70 to 6.3) ---------- */
      tl.fromTo("#name-mark", { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: IN }, 3.74);
      tl.fromTo("#name-arc", { strokeDasharray: "0 1" }, { strokeDasharray: "1 1", duration: 0.55, ease: "power2.out" }, 3.78);
      tl.fromTo("#name-word i", { y: 70, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: IN, stagger: 0.028 }, 3.9);
      tl.fromTo("#name-line", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 4.1);
      // the sheet tears away upward and the product comes up under it
      tl.fromTo("#name-in", { y: 0 }, { y: -2040, duration: 0.55, ease: "power3.inOut" }, 6.0);

      /* ---------- the desk ---------- */
      // close on the ticket while tonight is typed
      tl.set("#desk", { x: 1200, y: 480, scale: 1.75, transformOrigin: "0 0" }, 0);
      tl.fromTo("#desk", { x: 1200, y: 480, scale: 1.75 }, { x: -29, y: 480, scale: 1.75, duration: 0.6, ease: IN }, 6.15);
      // beat-locked: 12.65s, PRINT lands
      knock("#desk", 12.65, 8, 480);
      // pull back: the whole night along the front of the desk
      tl.to("#desk", { x: 40, y: 620, scale: 1, duration: 0.8, ease: CAM }, 13.1);
      // in on the ticket and the roll for the deal
      tl.to("#desk", { x: -26, y: 520, scale: 1.3, duration: 0.7, ease: CAM }, 15.4);
      knock("#desk", 16.85, 8, 520);

      /* ---------- captions: blur in, sit still, blur out ---------- */
      document.querySelectorAll(".cap").forEach(c => {
        const at = +c.dataset.start, dur = +c.dataset.duration, s = c.querySelector("span");
        tl.fromTo(s, { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.17, ease: "power2.out" }, at + 0.02);
        tl.to(s, { opacity: 0, filter: "blur(8px)", duration: 0.13, ease: "power1.in" }, at + dur - 0.14);
      });

      /* ---------- end card ---------- */
      const E = 18.57;
      tl.fromTo("#end-in", { clipPath: "circle(0px at 540px 900px)" }, { clipPath: "circle(2300px at 540px 900px)", duration: 0.4, ease: "power2.in" }, E + 0.02);
      // beat-locked: the logo lands on a beat
      tl.fromTo("#end-mark", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: IN }, E + 0.6);
      tl.fromTo("#end-arc", { strokeDasharray: "0 1" }, { strokeDasharray: "1 1", duration: 0.6, ease: "power2.out" }, E + 0.7);
      tl.fromTo("#end-word i", { y: 80, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.36, ease: IN, stagger: 0.03 }, E + 0.86);
      tl.fromTo("#end-line", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, E + 1.35);
      tl.fromTo("#end-url span", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: IN }, E + 1.6);
      tl.fromTo("#end-beta", { opacity: 0 }, { opacity: 0.9, duration: 0.25, ease: "power2.out" }, E + 1.75);
      tl.to({}, { duration: 0.01 }, 22.6 - 0.01);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
